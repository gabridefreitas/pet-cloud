services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petcloud}
      POSTGRES_USER: ${POSTGRES_USER:-petcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petcloud_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-petcloud}:${POSTGRES_PASSWORD:-petcloud_local}@db:5432/${POSTGRES_DB:-petcloud}
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:

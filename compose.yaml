name: pet-cloud

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petcloud}
      POSTGRES_USER: ${POSTGRES_USER:-petcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petcloud_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_RUM_ENABLED: ${VITE_RUM_ENABLED:-false}
        VITE_RUM_APP_MONITOR_ID: ${VITE_RUM_APP_MONITOR_ID:-}
        VITE_RUM_REGION: ${VITE_RUM_REGION:-}
        VITE_RUM_IDENTITY_POOL_ID: ${VITE_RUM_IDENTITY_POOL_ID:-}
        VITE_RUM_APP_VERSION: ${VITE_RUM_APP_VERSION:-0.1.0}
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      api:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-petcloud}:${POSTGRES_PASSWORD:-petcloud_local}@db:5432/${POSTGRES_DB:-petcloud}}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173"]}'
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploy}
      JWT_EXP_MINUTES: ${JWT_EXP_MINUTES:-1440}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
